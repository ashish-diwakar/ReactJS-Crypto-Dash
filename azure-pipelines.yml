# Node.js React Web App to Linux on Azure
# Build a Node.js React app and deploy it to Azure as a Linux web app.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main

variables:

  node_version: '22.x'
  build_dir: 'dist'

  # Azure Resource Manager connection created during pipeline creation
  azureSubscription: '68bc389f-8576-45e9-a8a1-fb45b99822bc'

   # Web app name
  webAppName: 'Cryptodashbyashish'

  # Environment name
  environmentName: 'webApp'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build Vite React App'
  jobs:
  - job: BuildJob
    displayName: Build
    pool:
      vmImage: $(vmImageName)

    steps:          
      - task: NodeTool@1
        inputs:
          version: '$(node_version)'
        displayName: 'Install Node.js'

      - script: |
          node -v
          npm -v
        displayName: 'Check Node version'

      - script: npm install
        displayName: 'Install dependencies'

      - script: npm run build
        displayName: 'Build Vite app'
      - task: ArchiveFiles@2
        displayName: 'Archive files'
        inputs:
          rootFolderOrFile: '$(build_dir)'
          includeRootFolder: false
          archiveType: zip
          archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
          replaceExistingArchive: true

      - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        artifact: drop

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy
    environment: $(environmentName)
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureRmWebAppDeployment@4
            displayName: 'Azure App Service Deploy: Cryptodashbyashish'
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              WebAppName: $(webAppName)
              packageForLinux: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              #RuntimeStack: 'NODE|22-lts'